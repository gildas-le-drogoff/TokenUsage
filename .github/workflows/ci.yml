name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Lint, unit tests and debug APK
        run: ./gradlew --console=plain lintDebug testDebugUnitTest assembleDebug

      # Kover only instruments unit tests of the debug variant: release / F-Droid APKs are untouched.
      - name: Coverage report (Kover)
        run: ./gradlew --console=plain koverXmlReportDebug koverHtmlReportDebug

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f app/build/reports/kover/reportDebug.xml ]; then
            python3 .github/scripts/kover_summary.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Release

# Builds the signed APK for a version tag and publishes it as a GitHub release
# under the file name the F-Droid recipe expects in its "Binaries" field:
#   releases/download/v<version>/TokenUsage-<version>.apk

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: fr.gildasledrogoff.tokenusage

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, version and fastlane metadata
        id: version
        run: .github/scripts/check-fdroid-metadata.sh "${GITHUB_REF_NAME#v}"

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      # No cache for releases: the build starts from a clean Gradle home.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not configured for this repository."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew --console=plain --no-build-cache assembleRelease

      - name: Remove signing key
        if: ${{ always() }}
        run: rm -f upload-keystore.jks keystore.properties

      # The certificate must be the one pinned in the F-Droid recipe, otherwise
      # F-Droid rejects the binary.
      - name: Verify signature
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk="TokenUsage-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"

          # The line prefix depends on the build-tools version
          # ("Signer #1" or "V2 Signer"), so only the digest is matched.
          actual="$("$build_tools/apksigner" verify --print-certs "$apk" |
            grep -m 1 'certificate SHA-256 digest:' | grep -oE '[0-9a-f]{64}')"
          expected="$(grep -A1 '^AllowedAPKSigningKeys:' "metadata/${APP_ID}.yml" |
            grep -oE '[0-9a-f]{64}' | head -n 1)"
          echo "certificate: $actual"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK certificate does not match AllowedAPKSigningKeys ($expected)."
            exit 1
          fi

          sha256sum "$apk" | tee "$apk.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: TokenUsage-${{ steps.version.outputs.version_name }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "TokenUsage-${VERSION_NAME}.apk" \
            "TokenUsage-${VERSION_NAME}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TokenUsage ${VERSION_NAME}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

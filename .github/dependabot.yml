version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Kotlin, KSP and the Compose compiler plugin must move together.
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
          - com.google.devtools.ksp*
      androidx:
        patterns:
          - androidx.*
      network:
        patterns:
          - com.squareup.*
          - com.jakewharton.retrofit*
      # bcpkix and bcprov must stay on the same version (AGP signing breaks otherwise).
      bouncycastle:
        patterns:
          - org.bouncycastle*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
